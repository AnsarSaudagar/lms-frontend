@if (loading()) {
  <div class="flex flex-col items-center justify-center h-[70vh] gap-4">
    <div class="w-9 h-9 border-[3px] border-border border-t-accent rounded-full animate-[spin_0.8s_linear_infinite]"></div>
    <p class="text-sm text-text-loading">Loading project…</p>
  </div>
} @else if (error() || !project()) {
  <div class="flex flex-col items-center justify-center h-[70vh] gap-3 text-center">
    <p class="text-base text-text">Couldn't find that project.</p>
    <button
      class="px-5 py-[10px] rounded-lg bg-surface border border-border text-text-button text-sm font-semibold cursor-pointer hover:border-border-hover"
      routerLink="/learner"
    >
      Back to Dashboard
    </button>
  </div>
} @else {
  <app-project-header [project]="project()"></app-project-header>

  <div class=" mx-auto pb-16">
    <div class="grid grid-cols-[1fr_360px] gap-10 items-start px-20 mt-8">
      <app-curriculum-list [project]="project()" [steps]="steps()"></app-curriculum-list>
      <app-purchase-card [project]="project()"></app-purchase-card>
    </div>
  </div>
}
