@if (inProgress().length) {
  <section class="px-8 pb-8">
    <div class="flex items-center gap-3 mb-5">
      <h2 class="text-xl font-bold text-text tracking-tight">Continue Learning</h2>
      <span class="text-xs font-semibold text-text-section bg-surface2 border border-border-alt rounded-full px-3 py-1">
        {{ inProgress().length }} in progress
      </span>
    </div>

    <div class="flex flex-col gap-3">
      @for (progress of inProgress(); track progress.id) {
        <app-progress-long-card [progress]="progress"></app-progress-long-card>
      }
    </div>
  </section>
}
