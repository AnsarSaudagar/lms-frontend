<section class="px-8 pb-12">
    <div class="flex items-center justify-between mb-5">
      <h2 class="text-xl font-bold text-text tracking-tight">Featured Projects</h2>
      <div class="flex gap-2">
        <button
          (click)="scrollProjects(-1)"
          class="w-8 h-8 rounded-full bg-surface border border-border flex items-center justify-center text-text-button cursor-pointer transition-colors duration-150 hover:border-border-hover hover:text-text"
        >
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M10 3l-5 5 5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button
          (click)="scrollProjects(1)"
          class="w-8 h-8 rounded-full bg-surface border border-border flex items-center justify-center text-text-button cursor-pointer transition-colors duration-150 hover:border-border-hover hover:text-text"
        >
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>

    <div #projectsRow class="flex gap-5 overflow-x-auto pb-2" style="scrollbar-width:none">
      @for (p of allProjects(); track p.id) {
        <app-project-card [project]="p"></app-project-card>
      }
    </div>
  </section>
