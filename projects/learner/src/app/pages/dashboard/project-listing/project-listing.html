<section class="px-8 pb-12">
    <div class="flex items-center justify-between mb-5">
      <h2 class="text-xl font-bold text-text tracking-tight">Featured Projects</h2>
      <div class="flex gap-2">
        <button
          (click)="scrollProjects(-1)"
          class="w-8 h-8 rounded-full bg-surface border border-border flex items-center justify-center text-text-button cursor-pointer transition-colors duration-150 hover:border-border-hover hover:text-text"
        >
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M10 3l-5 5 5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button
          (click)="scrollProjects(1)"
          class="w-8 h-8 rounded-full bg-surface border border-border flex items-center justify-center text-text-button cursor-pointer transition-colors duration-150 hover:border-border-hover hover:text-text"
        >
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>

    <div #projectsRow class="flex gap-5 overflow-x-auto pb-2" style="scrollbar-width:none">
      @for (p of allProjects(); track p.id) {
        <div
          class="flex-shrink-0 w-[300px] bg-surface border border-border rounded-2xl overflow-hidden cursor-pointer transition-colors duration-150 hover:border-border-card-hover"
        >
          <!-- Thumbnail -->
          <div class="relative h-[140px] flex items-center justify-center" [style.background]="p.color + '1f'">
            @if (p.pro) {
              <span class="absolute top-3 left-3 text-[10px] font-bold text-black bg-gold px-2 py-[3px] rounded-md uppercase tracking-wide">Pro</span>
            }
            <button
              class="absolute top-3 right-3 w-8 h-8 rounded-full bg-black/40 backdrop-blur-sm flex items-center justify-center border-0 cursor-pointer text-white/70 hover:text-white"
              (click)="$event.stopPropagation()"
            >
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 21s-7.5-4.6-10-9.1C.5 8.5 2 5 5.5 5c2 0 3.5 1.2 4.5 2.6C11 6.2 12.5 5 14.5 5 18 5 19.5 8.5 22 11.9 19.5 16.4 12 21 12 21z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
            </button>
            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" [style.color]="p.color">
              <path d="M9 18l-6-6 6-6M15 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>

          <!-- Body -->
          <div class="p-4">
            <h3 class="text-base font-bold text-text mb-1 truncate">{{ p.title }}</h3>
            <!-- <p class="text-xs text-text-desc mb-3 leading-relaxed line-clamp-2">{{ p.description }}</p> -->
            <div class="mb-3"></div>
            <div class="flex items-center gap-[6px] text-xs text-text-section mb-3">
              <span>{{ p.estimatedTime }}</span>
              <span>&bull;</span>
              <span>{{ p.stepCount }} steps</span>
              <span>&bull;</span>
              <span>{{ p.difficulty }}</span>
            </div>
          </div>
        </div>
      }
    </div>
  </section>
