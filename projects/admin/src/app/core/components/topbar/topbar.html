<header class="h-16 flex items-center justify-between gap-6 px-6 bg-bg">
  <div class="flex items-center gap-1.5 text-sm text-text-muted min-w-0">
    <span>Admin</span>
    <app-icon name="chevron-right" [size]="14" />
    <span class="text-text font-medium truncate">{{ pageTitle() }}</span>
  </div>

  <div class="flex items-center gap-4 shrink-0">
    <label class="relative hidden md:block">
      <app-icon name="search" [size]="16" class="absolute left-3 top-1/2 -translate-y-1/2 text-text-muted" />
      <input
        type="search"
        placeholder="Search learners, projects..."
        class="w-72 pl-9 pr-3 py-2 rounded-lg border border-border bg-surface text-sm text-text placeholder:text-text-muted outline-none focus:border-accent transition-colors"
      />
    </label>

    <button
      type="button"
      class="relative w-9 h-9 rounded-lg border border-border bg-surface flex items-center justify-center text-text-2 hover:bg-surface-2 cursor-pointer"
    >
      <app-icon name="bell" [size]="16" />
      <span class="absolute top-1.5 right-1.5 w-1.5 h-1.5 rounded-full bg-error"></span>
    </button>

    <div class="relative">
      <button
        type="button"
        (click)="toggleMenu()"
        class="flex items-center gap-2.5 pl-1 pr-2 py-1 rounded-lg border-0 bg-transparent cursor-pointer hover:bg-surface-2"
      >
        <span class="w-8 h-8 rounded-full bg-accent-soft text-accent-dark font-semibold text-xs flex items-center justify-center">
          {{ authService.currentUser()?.avatarInitials }}
        </span>
        <span class="hidden sm:flex flex-col items-start leading-tight">
          <span class="text-sm font-medium text-text">{{ authService.currentUser()?.name }}</span>
          <span class="text-xs text-text-muted">{{ authService.currentUser()?.role }}</span>
        </span>
        <app-icon name="chevron-down" [size]="14" class="text-text-muted" />
      </button>

      @if (menuOpen()) {
        <div class="absolute right-0 top-[calc(100%+8px)] w-44 bg-surface border border-border rounded-lg shadow-md py-1 z-20">
          <button
            type="button"
            (click)="logout()"
            class="w-full flex items-center gap-2.5 px-3.5 py-2.5 text-sm text-text hover:bg-surface-2 border-0 bg-transparent cursor-pointer text-left"
          >
            <app-icon name="logout" [size]="15" />
            Log out
          </button>
        </div>
      }
    </div>
  </div>
</header>
