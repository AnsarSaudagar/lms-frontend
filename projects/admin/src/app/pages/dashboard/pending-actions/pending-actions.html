<div class="bg-surface border border-border rounded-xl shadow-xs p-6 h-full flex flex-col">
  <h3 class="text-[15px] font-semibold text-text mb-4">Pending actions</h3>

  <div class="flex flex-col gap-1">
    @for (action of actions; track action.title) {
      <button
        type="button"
        class="flex items-center gap-3 px-2 py-2.5 rounded-lg border-0 bg-transparent hover:bg-surface-2 cursor-pointer text-left"
      >
        <span class="w-9 h-9 rounded-lg flex items-center justify-center shrink-0" [class]="TONE_CLASS[action.tone]">
          <app-icon [name]="action.icon" [size]="16" />
        </span>
        <span class="flex-1 text-sm text-text leading-snug">{{ action.title }}</span>
        <app-icon name="chevron-right" [size]="16" class="text-text-muted shrink-0" />
      </button>
    }
  </div>
</div>
