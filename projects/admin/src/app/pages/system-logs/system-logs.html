<div class="flex flex-col gap-6 py-6">
  <div>
    <h1 class="text-2xl font-semibold text-text mb-1">System logs</h1>
    <p class="text-sm text-text-muted">Authentication, project, and content activity across the platform.</p>
  </div>

  <div class="bg-surface border border-border rounded-xl shadow-xs p-6">
    <div class="flex flex-col divide-y divide-border">
      @for (log of logs; track log.timestamp + log.message) {
        <div class="flex items-center gap-4 py-3">
          <span class="px-2 py-1 rounded-md bg-surface-2 text-text-2 text-[11px] font-medium uppercase tracking-wide shrink-0 w-20 text-center">
            {{ log.tag }}
          </span>
          <span class="flex-1 text-sm text-text truncate">{{ log.message }}</span>
          <span class="text-sm text-text-muted hidden sm:block">{{ log.meta }}</span>
          <span class="text-xs text-text-muted shrink-0 w-20 text-right">{{ log.timestamp }}</span>
        </div>
      }
    </div>
  </div>
</div>
